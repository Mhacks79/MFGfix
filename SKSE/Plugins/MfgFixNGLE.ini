[Transition]
; 0 preserves immediate legacy Mfg calls. 0.75 enables smooth transitions.
; Ext functions supply their own transition duration; range 0..10 seconds.
fDefaultSpeed=0.00

[Console]
; 1: the plain "mfg phoneme|modifier|expression|reset" console commands edit the face at
; once, exactly like Mfg Console (mp / me / mm aliases, live table). 0 makes them smooth
; requests applied when the console closes. The ng test commands and every Papyrus
; function always use this plugin.
bPassToMfgConsole=1

[MfgConsole]
; Mfg Console replacement. When MfgConsole.dll is NOT loaded (hide it in MO2, including
; the copy shipped inside SexLab), this plugin does its whole job: the console.swf info
; table, the phoneme / modifier / expression table, the extra info window, getmoditem,
; savebat, playerblink and the live mfg commands. console.swf itself comes from Mfg
; Console or SexLab and stays installed. When MfgConsole.dll is loaded it stays in
; charge and none of this is used. 0 turns the replacement off.
bReplace=1
; Player blink, as Mfg Console's EnablePlayerBlink. In game: playerblink start / stop.
bPlayerBlink=1
; Extra info window and the "overwritten by" plugin names, as Mfg Console's
; EnableExtraInfo. Reads the record headers of every active plugin once, in the
; background, after the game data has loaded.
bExtraInfo=1

[Debug]
; 1 writes Documents\My Games\Skyrim\SKSE\MfgFixNGLE.log. 0 (the default): nothing is
; written, not even an empty file.
EnableLog=0
