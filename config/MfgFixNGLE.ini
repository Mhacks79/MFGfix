; MFG Fix NG LE - Test Build 5
[Transition]
; 0 is immediate for legacy Mfg calls; 0.75 enables smoothing. Ext functions set their own duration.
fDefaultSpeed=0.00

[Console]
; When the original MfgConsole.dll is loaded, pass legacy mfg commands to it.
bPassToMfgConsole=1

[MfgConsole]
; Replace Mfg Console functionality only when its DLL is absent.
bReplace=1
bPlayerBlink=1
bExtraInfo=1

[Debug]
; 0 = no logging; 1 = write Documents\My Games\Skyrim\SKSE\MfgFixNGLE.log.
EnableLog=0
